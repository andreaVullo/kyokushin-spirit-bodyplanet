<style>
html,body{margin:0;height:100%;background:#121212;overflow:hidden}
*{box-sizing:border-box}
.st{position:relative;width:100%;height:100%;overflow:hidden;background:#121212 url(https://globaluserfiles.com/media/313908_9314d91ce6abcb1b44ff7259b763539fc1537501.jpeg) center/cover no-repeat;font-family:Archivo,Arial,sans-serif;color:#F6F2EC}

.tag{position:absolute;top:16px;left:16px;font:12px/1 Archivo Black,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;background:#E00000;color:#F6F2EC;padding:9px 12px}

.play svg{width:15px;height:15px;flex:none}

.bar button:hover,.bar a:hover{background:#E00000;border-color:#E00000}
