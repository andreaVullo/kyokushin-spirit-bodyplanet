<!doctype html><html lang="it"><meta charset="utf-8"><title>Inviti · verifica mobile</title>
<style>body{margin:20px;background:#e6e9ec;color:#182332;font:14px Arial}button{padding:12px 20px}main{display:flex;flex-wrap:wrap;align-items:flex-start;gap:20px}iframe{display:block;border:1px solid #536374}pre{white-space:pre-wrap}h2{font-size:14px}</style>
<h1>Inviti · verifica mobile</h1><button id="run">VERIFICA LAYOUT</button><pre id="report" role="status">Pronto.</pre><main id="frames"></main>
<script>
const cases=[{name:'Telefono compatto',width:320,height:640},{name:'Telefono verticale',width:390,height:844},{name:'Telefono orizzontale',width:568,height:240},{name:'App senza collegamento giocatori',width:390,height:844,blocked:true}];
const frames=cases.map(item=>{const section=document.createElement('section'),title=document.createElement('h2'),frame=document.createElement('iframe');title.textContent=item.name;frame.width=item.width;frame.height=item.height;frame.title=item.name;section.append(title,frame);document.getElementById('frames').append(section);return{...item,frame};});
Promise.all(frames.map(async item=>{if(!item.blocked){item.frame.src='../online.html?room=AB23XY';return;}let source=await(await fetch('../online.html')).text();source=source.replace('<head>','<head><base href="'+new URL('../',location.href).href+'"><script>window.RTCPeerConnection=undefined;<\/script>');item.frame.srcdoc=source;}));
document.getElementById('run').onclick=()=>{const results=[];for(const item of frames){const doc=item.frame.contentDocument,root=doc?.getElementById('dojo-invite');if(!root){results.push('FAIL '+item.name+': non caricato');continue;}const width=item.frame.contentWindow.innerWidth,scroll=doc.documentElement.scrollWidth,button=doc.getElementById('invite-play');const rect=button.getBoundingClientRect();let pass=scroll<=width+1;if(item.blocked)pass=pass&&button.hidden&&doc.getElementById('invite-browser-help').open&&!!doc.getElementById('invite-message').textContent;else pass=pass&&!button.hidden&&rect.left>=0&&rect.right<=width+1&&rect.height>=44&&doc.getElementById('invite-code').textContent==='AB23XY';results.push((pass?'PASS ':'FAIL ')+item.name+' '+item.width+'×'+item.height);}document.getElementById('report').textContent=results.join('\n');};
</script></html>
