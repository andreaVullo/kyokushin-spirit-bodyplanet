<!doctype html><html lang="it"><meta charset="utf-8"><title>Verifica kanji sul gi</title>
<style>body{margin:20px;background:#14202c;color:#f4eedf;font:15px system-ui}label{margin-right:20px}select{font:inherit;padding:7px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(700px,1fr));gap:16px}canvas{width:100%;background:#263647;border:1px solid #667;box-sizing:border-box}pre{white-space:pre-wrap}a{color:#e8c776}</style>
<h1>Kanji · originale, uniforme, verso opposto</h1><p>Il simbolo viene composto sulla stoffa originale. Il braccio e la pelle restano davanti. Le pose di schiena o coperte restano prive di simbolo.</p>
<label>Karateka <select id="subject"></select></label><label>Foglio <select id="category"><option>base</option><option>pugni</option><option>calci</option><option>movimento</option><option>difesa</option></select></label><p id="status">Caricamento…</p><main id="frames"></main><pre id="measurements"></pre>
<script src="../scripts/roster.js"></script><script src="../scripts/karateka-atlas.js"></script><script src="../scripts/arcade-atlas.js"></script><script src="../scripts/gi-branding.js"></script>
<script>
const subject=document.getElementById('subject'),category=document.getElementById('category'),sources=new Map(),images=new Map();
for(const [value,label] of [['male','Arcade uomo'],['female','Arcade donna'],...Object.values(KyokushinRoster).filter(c=>c.assetId).map(c=>[c.assetId,c.name])]){const o=document.createElement('option');o.value=value;o.textContent=label;subject.append(o);}
window.__kyokushinRegisterSprite=(key,value)=>sources.set(key,value);window.__arcadeRegisterSprite=(key,value)=>sources.set(key,value);
async function imageFor(key,arcade){if(images.has(key))return images.get(key);await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='../assets/'+(arcade?'arcade/':'karateka/')+key+'.js';s.onload=resolve;s.onerror=reject;document.head.append(s);});const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=sources.get(key)});images.set(key,image);return image;}
const params=new URLSearchParams(location.search); if(params.has('subject')) subject.value=params.get('subject'); if(params.has('category')) category.value=params.get('category'); const only=params.get('poses')?.split(',').map(Number);
let revision=0;
async function draw(){const stamp=++revision,id=subject.value,arcade=['male','female'].includes(id),cat=category.value,main=document.getElementById('frames'),measure=[];main.replaceChildren();category.disabled=arcade;await GiBranding.load();
const entries=arcade?ArcadeSpriteAtlas[id].map((meta,index)=>({meta,index,key:meta.sheet})):KyokushinSpriteAtlas[id][cat].frames.filter(f=>(cat!=='base'||[0,11].includes(f.index))&&f.source_sheet===cat&&f.source_frame===f.index).map(meta=>({meta,index:meta.index,key:id+'/'+cat}));
for(const {meta,index,key}of entries){if(only&&!only.includes(index))continue;const image=await imageFor(key,arcade);if(stamp!==revision)return;const [sx,sy,sw,sh]=meta.region,original=document.createElement('canvas');original.width=sw;original.height=sh;original.getContext('2d').drawImage(image,sx,sy,sw,sh,0,0,sw,sh);const options=arcade?GiBranding.arcadeOptions(id,index,meta):GiBranding.namedOptions(id,cat,index,KyokushinSpriteAtlas[id][cat].nominal_height),branded=GiBranding.apply(original,options),report=GiBranding.report(branded)||{status:options.skip?'skipped':'unmodified'};const canvas=document.createElement('canvas');canvas.width=720;canvas.height=290;const ctx=canvas.getContext('2d');ctx.fillStyle='#f4eedf';ctx.font='14px system-ui';ctx.fillText(index+' · '+report.status,12,20);for(let view=0;view<3;view++){const source=view===0?original:view===1?branded:GiBranding.forFacing(branded,-1),scale=Math.min(220/source.height,220/source.width),x=view*240+120,y=268;ctx.save();ctx.translate(x,y);if(view===2)ctx.scale(-1,1);ctx.drawImage(source,-source.width*scale/2,-source.height*scale,source.width*scale,source.height*scale);ctx.restore();ctx.fillText(['originale','uniforme','verso opposto'][view],view*240+15,42);}main.append(canvas);measure.push({pose:index,status:report.status,bounds:report.bounds,options});}
document.getElementById('status').textContent=id+' · '+measure.length+' pose · '+measure.filter(r=>r.status==='detected').length+' uniformate';document.getElementById('measurements').textContent=JSON.stringify(measure,null,2);}
subject.onchange=category.onchange=()=>draw().catch(e=>document.getElementById('status').textContent=e.stack);draw();
</script></html>
